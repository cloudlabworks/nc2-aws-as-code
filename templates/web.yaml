#cloud-config
# First-boot config for web-01. Rendered by templatefile(); ${ssh_key} is the only variable.
users:
  - name: ops
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_key}
package_update: true
packages:
  - nginx
runcmd:
  - systemctl enable --now nginx
